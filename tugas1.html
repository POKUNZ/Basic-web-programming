<body>


<a href="United.html" style="

">

</a>



<script>


    function getGrade(nilai) {
        if (nilai >= 80) {
            return "A";
        } else if (nilai >= 75) {
            return "A-";
        } else if (nilai >= 66) {
            return "B";
        } else if (nilai >= 60) {
            return "B-";
        } else if (nilai >= 55) {
            return "C+";
        } else if (nilai >= 40) {
            return "C";
        } else {
            return "E";
        }
    }

    nama = window.prompt("Nama");
    nilai = window.prompt("Nilai");

    alert("Nama: " + nama + "\nNilai: " + nilai + "\nGrade: " + getGrade(Number(nilai)));

</script>
</body>
